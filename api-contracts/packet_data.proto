syntax = "proto3";
package packet_inspector;
option go_package = "./router;router";

message NetworkPacket {
    string source_ip = 1;
    string dest_ip = 2;
    int32 source_port = 3;
    int32 dest_port = 4;
    string protocol = 5;
    bytes raw_payload = 6;
    int64 timestamp_ms = 7;
    uint32 seq_num = 8;
    uint32 tcp_flags = 9;
}