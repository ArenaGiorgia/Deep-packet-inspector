<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPI Security Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>🛡️ DPI Analizzatore Forense</h1>
            <div style="display: flex; gap: 15px; align-items: center;">
                <!-- Pulsante Freeze per bloccare lo scorrimento visivo durante l'esame -->
                <button id="freeze-btn" class="btn-freeze">⏸️ PAUSA FLUSSO</button>
                <div id="status-badge">Connessione in corso...</div>
            </div>
        </div>
        
        <!-- Pannello Telemetria (I contatori continuano ad aggiornarsi anche in pausa) -->
        <div class="kpi-container">
            <div class="kpi-box">
                <span class="kpi-label">Traffico Analizzato</span>
                <span class="kpi-value" id="kpi-total">0</span>
            </div>
            <div class="kpi-box threat-box">
                <span class="kpi-label">Minacce Bloccate</span>
                <span class="kpi-value" id="kpi-threats">0</span>
            </div>
            <div class="kpi-box">
                <span class="kpi-label">Ultima Latenza DPI</span>
                <span class="kpi-value" id="kpi-latency">0 ms</span>
            </div>
        </div>
    </header>

    <!-- Split Screen: Layout strutturato a due colonne -->
    <main class="split-screen">
        <!-- Colonna 1: Tutto il traffico TCP Grezzo -->
        <section class="feed-column">
            <h2>ANALISI FLUSSO TCP (LIV. 4)</h2>
            <div id="raw-container" class="scroll-container"></div>
        </section>
        
        <!-- Colonna 2: Solo gli allarmi DPI isolati -->
        <section class="feed-column">
            <h2>RILEVAMENTO MINACCE DPI (LIV. 7)</h2>
            <div id="alerts-container" class="scroll-container"></div>
        </section>
    </main>

    <!-- Effetto Monitor CRT: Linee di scansione in sovrimpressione -->
    <div class="scanlines"></div>

</body>
</html>
