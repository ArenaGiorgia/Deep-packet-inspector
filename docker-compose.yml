# Creiamo una rete virtuale interna dedicata al nostro sistema
networks:
  dpi_network:
    driver: bridge

services:
  # 1. Il Livello di Analisi (Python)
  analyzer:
    build:
      context: .
      dockerfile: analyzer-python/Dockerfile
    networks:
      - dpi_network
    ports:
      - "9001:9001/udp"

  # 2. Il Gateway/Router (Go)
  router:
    build: ./router-go
    networks:
      - dpi_network
    ports:
      - "8080:8080"  # Porta per ricevere i dati dal Sensore
      - "8081:8081"  # Porta per servire la Dashboard Web
    depends_on:
      - analyzer

  # 3. Il Sensore Edge (C++)
  sensor:
    build: 
      context: . 
      dockerfile: sensor-cpp/Dockerfile
    env_file:
      - .env
    network_mode: "service:router"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      - router

  # 4. Il Generatore di Traffico (Test)
  generator:
    build: ./traffic-generator
    networks:
      - dpi_network
    # Lo facciamo partire con qualche secondo di ritardo per dare tempo al sistema di avviarsi
    command: >
      /bin/sh -c "sleep 5 && python -u generator.py"